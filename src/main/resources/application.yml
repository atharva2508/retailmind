spring:
  config:
    # Optional local .env file (KEY=VALUE). Real environment variables win over it.
    import: optional:file:.env[.properties]
  application:
    name: springboot-postgres-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/products_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Fail in 5s, not the default 30s, when the database is unreachable.
      connection-timeout: 5000
  flyway:
    # Schema lives in src/main/resources/db/migration. A database that was built before Flyway
    # (tables exist, no history table) is marked as already at V1 instead of being rebuilt.
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      # Hibernate only checks that entities match the migrated schema. It never changes tables.
      ddl-auto: validate
    show-sql: false
  jackson:
    deserialization:
      accept-float-as-int: false

server:
  port: 8080

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 900000
    refresh-expiration-ms: 604800000
  seed:
    enabled: ${SEED_ENABLED:false}
    admin-password: ${SEED_ADMIN_PASSWORD:}
    manager-password: ${SEED_MANAGER_PASSWORD:}
    reviewer-password: ${SEED_REVIEWER_PASSWORD:}
    user-password: ${SEED_USER_PASSWORD:}
