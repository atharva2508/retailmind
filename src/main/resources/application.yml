spring:
  config:
    # Optional local .env file (KEY=VALUE). Real environment variables win over it.
    import: optional:file:.env[.properties]
  application:
    name: springboot-postgres-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/products_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Fail in 5s, not the default 30s, when the database is unreachable.
      connection-timeout: 5000
  sql:
    init:
      # Adds database-side constraints after Hibernate has made the tables. See db/postgres-constraints.sql.
      mode: always
      schema-locations: classpath:db/postgres-constraints.sql
      separator: ";;"
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: false
  jackson:
    deserialization:
      accept-float-as-int: false

server:
  port: 8080

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 900000
    refresh-expiration-ms: 604800000
  seed:
    enabled: ${SEED_ENABLED:false}
    admin-password: ${SEED_ADMIN_PASSWORD:}
    manager-password: ${SEED_MANAGER_PASSWORD:}
    reviewer-password: ${SEED_REVIEWER_PASSWORD:}
    user-password: ${SEED_USER_PASSWORD:}
